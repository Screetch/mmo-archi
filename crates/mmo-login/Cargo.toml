[package]
name = "mmo-login"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The login service of mmo-archi: the check of a password, the admission queue and the sessions."

[dependencies]
getrandom = "0.4.3"
mmo-protocol = { path = "../mmo-protocol" }
mmo-store = { path = "../mmo-store" }
redis = { version = "1.8.1", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
thiserror = "2.0.21"

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "process"] }

[lints]
workspace = true
