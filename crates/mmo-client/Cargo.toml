[package]
name = "mmo-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The client of mmo-archi: its prediction, its camera, its view of the world and its window."

[features]
# The scripted servers of `testing`, for the tests of the crates that drive a client.
testing = ["dep:rcgen"]

[dependencies]
bitcode = "=0.6.9"
glam = "0.34.3"
mmo-collide = { path = "../mmo-collide" }
mmo-protocol = { path = "../mmo-protocol" }
mmo-render = { path = "../mmo-render" }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
thiserror = "2.0.21"
wgpu = "30.0.1"
winit = "0.30.13"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[[bin]]
name = "mmo-check"
path = "src/bin/check.rs"

[[bin]]
name = "mmo-play"
path = "src/bin/play.rs"

[lints]
workspace = true
