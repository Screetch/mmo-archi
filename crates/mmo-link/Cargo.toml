[package]
name = "mmo-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The TLS of the links between the servers of mmo-archi."

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
thiserror = "2.0.21"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
