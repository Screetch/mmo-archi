name: contract

# The public items of each crate of the workspace are a door of mmo-archi: a change that breaks one forces a caller to
# change code. script/contract.sh reads each crate at the last tag and in the pull request with cargo-semver-checks,
# and names each break, which needs a title with a !. It is a workflow of its own, and not a job of gates.yml, since it
# runs again at each edit of the title: a run of gates.yml for an edit would cancel the suite of the head, or show each
# of its jobs as skipped.
on:
  pull_request:
    types: [opened, synchronize, edited, reopened]
  # release.yml starts it on the branch of the pull request of a release, which the token of a workflow opens, and
  # which so starts no workflow.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  contract:
    # A branch protection requires the check by this name.
    name: the contract
    runs-on: ubuntu-latest
    # The job builds the documentation of each crate at the tag, at the base and at the head.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51.0
      # The script reads each crate of the last tag through git, so the tags come with the commit that each names. With
      # no tag on origin, a fetch of the glob v* exits 1 before the script runs, and the script passes with no tag, so
      # the fetch runs only when a tag v* stands on origin.
      # The title comes through the environment, and never into the text of the script.
      - env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git ls-remote --tags --refs origin 'v*')" ]; then
            git fetch --no-tags --depth=1 origin '+refs/tags/v*:refs/tags/v*'
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            TITLE=$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json title --jq .title)
            BASE=main
          fi
          # A break that the base holds already was declared by the pull request that made it.
          git fetch --no-tags --depth=1 origin "$BASE"
          sh script/contract.sh --since "$(git rev-parse FETCH_HEAD)" --title "$TITLE"
