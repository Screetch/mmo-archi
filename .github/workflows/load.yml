name: load

# The load test of section 12 of docs/architecture.md, on a runner of CI: no bot runs on a machine of a worker. It
# builds the base of the pull request and its head, each in release, and runs the same stages of bots against each
# stack in turn on the same runner, so the two columns of its summary compare. A pull request of a stack has the layer
# below it as its base, so each layer shows what it changes. A runner of Linux has 4 cores, which
# the bots, the gateway and the layer writers share, so a number of this job compares with the other column of the
# same run, and not with a run on another machine. It runs stage 2, 500 bots with half in a town on one layer of cap
# 500, and the shards and the layers of stage 3, 500 bots in 2 shards of cap 250 with layers of cap 20, since no test
# runs more than 500 bots. In stage 3, 40 bots start near the east border of their zone and walk east, so this run
# proves the hand-over to the next zone too: they log in first, so each shard holds them on its first layer, and the report
# fails when a bot saw a bot of the other shard, or when a crosser did not enter the layer with its number in the next zone.
# It runs stage 4 too, 300 bots on a shard of cap 200, of which 100 wait in the queue. Last it runs stage 6 on the head
# alone, with 200 bots and one fault for each run: the stop of the layer writer of their layer, of the gateway and of
# the keeper, as `script/faults.sh` says. Stage 5 waits for the drain and the move, which main does not hold yet.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/mmo-bots/**
      - crates/mmo-client/**
      - crates/mmo-collide/**
      - crates/mmo-gateway/**
      - crates/mmo-protocol/**
      - crates/mmo-zone/**
      - script/local.sh
      - script/report.sh
      - script/faults.sh
      - .github/workflows/load.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  load:
    name: the load
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/redis
      # perf samples the gateway and the layer writers during the play of each stage.
      # A kernel of the image that has no tools of its own leaves the job with no profile, and the stages run all the
      # same.
      - run: |
          sudo apt-get update
          if sudo apt-get install -y --no-install-recommends "linux-tools-$(uname -r)" linux-tools-common; then
            sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          else
            echo "::warning::no perf for the kernel $(uname -r), so the stages run with no profile"
          fi
      - name: the stages
        env:
          MMO_LOCAL_PROFILE: release
          MMO_BOTS_PLAY_SECONDS: "30"
        run: |
          set -eu
          export MMO_LOCAL_PG_BIN
          MMO_LOCAL_PG_BIN=$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -name bin -type d | sort -V | tail -n 1)
          out=$RUNNER_TEMP/load
          mkdir -p "$out"
          # The commit of a pull request is the merge of its head into its base, its first parent.
          git worktree add -q "$RUNNER_TEMP/base" HEAD^1
          # The CPU of a process in cores, over the last 20 s of the play, from its ticks of /proc each second.
          sample() {
            while kill -0 "$1" 2>/dev/null; do
              echo "$(date +%s) $(awk '{ print $14 + $15 }' "/proc/$1/stat")"
              sleep 1
            done
          }
          cores() {
            tail -n 23 "$1" | head -n 21 | awk -v hz="$(getconf CLK_TCK)" \
              'NR == 1 { t = $1; c = $2 } END { printf "%.2f", ($2 - c) / hz / ($1 - t) }'
          }
          # stage <tree> <name> <bots> <town> <shards> <cap of a shard> <cap of a layer> [<bots that must wait in the queue> [<crossers>]]
          stage() {
            dir=$out/$2-$3-$4-$5
            mkdir -p "$dir"
            # The crossers walk into a second zone, so a stage with crossers runs two zones.
            zones=1
            [ "${9:-0}" -eq 0 ] || zones=2
            export MMO_LOCAL_DIR=$dir/stack MMO_LOCAL_SHARDS=$5 MMO_LOCAL_SHARD_CAP=$6 MMO_LOCAL_LAYER_CAP=$7
            export MMO_LOCAL_ZONES=$zones MMO_BOTS_CROSSERS=${9:-0}
            (cd "$1" && sh script/local.sh start) >"$dir/start.log"
            # The pool of layer writers: an idle writer takes no CPU, so their sum is the cores of the layers.
            writers=
            for file in "$MMO_LOCAL_DIR"/gateway.pid "$MMO_LOCAL_DIR"/zone*.pid; do
              name=$(basename "$file" .pid)
              [ "$name" = gateway ] || writers="${writers:+$writers,}$(cat "$file")"
              sample "$(cat "$file")" >"$dir/$name.cpu" &
            done
            # The profile covers 20 s of the play: the ramp takes 1 s for each 50 bots.
            delay=$(($3 / 50 + 5))
            command -v perf >/dev/null || delay=
            for name in ${delay:+gateway writers}; do
              pids=$writers
              [ "$name" = writers ] || pids=$(cat "$MMO_LOCAL_DIR/$name.pid")
              (sleep "$delay" && perf record -q -F 199 -g -p "$pids" -o "$dir/$name.perf" -- sleep 20 >/dev/null 2>&1) &
            done
            # The bots of the base can fail, as a measure of a defect that the head fixes. Those of the head end the job.
            if ! (cd "$1" && MMO_BOTS_TOWN=$4 MMO_BOTS_WAITING=${8:-0} timeout 600 sh script/local.sh bots "$3") >"$dir/bots.log" 2>&1; then
              echo "::warning::the bots of $2 failed in the stage of $3 bots"
              [ "$2" = base ] || failed="$failed $3"
            fi
            # The head fails too when its report shows a layer over its cap, a shard with too few layers, a bot that saw another shard, or a crosser that stayed or changed its layer number.
            if [ "$2" != base ] && ! sh "$GITHUB_WORKSPACE/script/report.sh" "$dir/bots.log" "$3" "$5" "${8:-0}" 0 "${9:-0}"; then
              failed="$failed $3"
            fi
            total=0
            for file in "$dir"/zone*.cpu; do
              total=$(echo "$total $(cores "$file")" | awk '{ printf "%.2f", $1 + $2 }')
            done
            echo "gateway $(cores "$dir/gateway.cpu") cores, layer writers $total cores" >>"$dir/bots.log"
            (cd "$1" && sh script/local.sh stop) >/dev/null
            wait
            # The share of each part of the code in the profile: the kernel, QUIC, its crypto, tokio, the allocator and
            # the code of the game.
            for name in ${delay:+gateway writers}; do
              perf report -q -i "$dir/$name.perf" --no-children --sort symbol --stdio -g none 2>/dev/null >"$dir/$name.syms" ||
                true
              head -n 40 "$dir/$name.syms" >"$dir/$name.top"
              awk '{ share = $1; sub("%", "", share); part = "other"
                if ($0 ~ /\[k\]/) part = "kernel"; else if ($0 ~ /quinn/) part = "quinn"
                else if ($0 ~ /ring|rustls/) part = "crypto"; else if ($0 ~ /tokio/) part = "tokio"
                else if ($0 ~ /malloc|free|realloc/) part = "allocator"; else if ($0 ~ /mmo_/) part = "game"
                total[part] += share }
                END { printf "%s:", name; for (part in total) printf " %s %.1f%%", part, total[part]; print "" }' \
                name="$name" "$dir/$name.syms" >>"$dir/bots.log"
            done
            {
              echo "### $2: $3 bots, $4 in town, $5 shards of cap $6, layers of cap $7${8:+, $8 wait in the queue}"
              echo '```'
              tail -n 30 "$dir/bots.log"
              echo '```'
              for name in ${delay:+gateway writers}; do
                echo "<details><summary>$name, the 40 hottest functions</summary>"
                echo; echo '```'; cat "$dir/$name.top"; echo '```'; echo "</details>"
              done
            } >>"$GITHUB_STEP_SUMMARY"
          }
          # The first start of each tree builds it in release, which takes minutes.
          failed=
          for tree in "$RUNNER_TEMP/base:base" "$GITHUB_WORKSPACE:head"; do
            for bots in "500 250 1 500 500" "500 0 2 250 20 0 40" "300 0 1 200 20 100"; do
              echo "$(date +%T) ${tree##*:}: $bots"
              # shellcheck disable=SC2086 # the count of bots, the count in town, the shards and their caps
              stage "${tree%%:*}" "${tree##*:}" $bots
            done
          done
          # Stage 6, on the head: a new stack for each fault, since a stack keeps the players of the run before.
          broken=
          export MMO_LOCAL_SHARDS=1 MMO_LOCAL_SHARD_CAP=200 MMO_LOCAL_LAYER_CAP=20
          for fault in writer gateway keeper; do
            echo "$(date +%T) head: stage 6, $fault"
            dir=$out/head-faults-$fault
            mkdir -p "$dir"
            export MMO_LOCAL_DIR=$dir/stack
            sh script/local.sh start >"$dir/start.log"
            sh script/faults.sh "$fault" 200 "$dir/bots.log" >"$dir/faults.log" 2>&1 || broken="$broken $fault"
            sh script/local.sh stop >/dev/null
            {
              echo "### head: stage 6, the fault $fault, 200 bots"
              echo '```'
              tail -n 36 "$dir/faults.log"
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          done
          [ -z "$failed" ] || echo "::error::the bots of the head failed in the stages of$failed bots"
          [ -z "$broken" ] || echo "::error::the bots of the head failed in the stage 6 for the faults of$broken"
          [ -z "$failed$broken" ] || exit 1
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: load
          path: |
            ${{ runner.temp }}/load/**/*.log
            ${{ runner.temp }}/load/**/*.cpu
            ${{ runner.temp }}/load/**/*.top
            ${{ runner.temp }}/load/**/*.syms
